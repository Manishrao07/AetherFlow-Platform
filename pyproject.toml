[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project1-workflow"
version = "0.1.0"
description = "Multi-Agent Workflow Platform (Planner, Retrieval, Execution, Review) - Polynomial AI assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "redis>=5.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "reportlab>=4.0",  # WHY: pure-Python PDF export of reports (no system libraries needed)
    "defusedxml>=0.7",  # WHY: arXiv answers in XML; the stdlib parser is unsafe for untrusted XML
]

[project.optional-dependencies]
# The UI image installs ui/requirements.txt; this extra lets you run the UI from a dev checkout.
ui = [
    "streamlit>=1.45,<2",
]
dev = [
    "streamlit>=1.45,<2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "pyyaml>=6",
    "types-pyyaml",
    "types-defusedxml",
    "types-reportlab",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov=ui --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app", "ui"]
# WHY: SQLAlchemy async runs code inside greenlets; without this, coverage misses those lines.
concurrency = ["greenlet", "thread"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests and for internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S105", "S106"]
"migrations/**" = ["E501", "I001", "RUF012"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "scripts", "ui"]
plugins = ["pydantic.mypy"]

