# NOTE: GitHub only runs workflows found at <repo root>/.github/workflows. The repository root is
# this project folder, so every step runs from the root and no `working-directory` is needed.
# (If you ever nest the project in a bigger repo, move this file up and add
# `defaults.run.working-directory: project1_workflow`, plus `context:` paths for the builds.)
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: wf, POSTGRES_PASSWORD: wf, POSTGRES_DB: wf_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wf" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://wf:wf@localhost:5432/wf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t project1-workflow .
      - run: docker build --target ui -t project1-workflow-ui .
